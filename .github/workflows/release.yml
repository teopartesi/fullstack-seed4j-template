name: Release

run-name: Release from ${{ github.ref_name }} by @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard-main:
    name: 🔒 Check main branch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Select the main branch when starting this workflow."
          exit 1

      - name: Confirm release branch
        run: echo "Releasing commit ${GITHUB_SHA} from main."

  validate:
    name: ✅ Validate release
    needs: guard-main
    uses: ./.github/workflows/ci.yml
    permissions:
      actions: read
      contents: read
    secrets: inherit

  release:
    name: 🎖️ Semantic release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: npm

      - name: Setup project npm version
        run: npm install --global "$(node --print 'require(\"./package.json\").packageManager')"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Create semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run semantic-release
