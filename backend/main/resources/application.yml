spring:
  application:
    name: starter
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-exception: false
      include-binding-errors: never

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
